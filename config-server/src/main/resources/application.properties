spring.application.name=config-server
server.port=8888

# ---- Git backend ----
# The config files live in the config-repo/ folder of this repository.
# Override any of these with environment variables, no need to edit this file.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/GowthamPrasath15/student-api}
spring.cloud.config.server.git.search-paths=${CONFIG_GIT_SEARCH_PATHS:config-repo}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true

# Needed only if the repository is PRIVATE (not needed while it is public).
# Username = your GitHub username, password = a GitHub personal access token.
# Set them as environment variables. Never write real values in this file.
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD:}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
