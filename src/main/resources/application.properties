spring.application.name=student-api

# --- PostgreSQL (matches docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/school
spring.datasource.username=postgres
spring.datasource.password=postgres

# Tables are created by db/school_schema.sql, so Hibernate must not touch them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- File upload ---
# Folder for uploaded files (relative to where the app is started; created automatically)
app.upload-dir=uploads
# Size limits (the handler's 413 message says 5 MB, keep them in sync)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
