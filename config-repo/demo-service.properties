# File name = spring.application.name of the client (demo-service)

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
# Never commit the real password. Set DB_PASSWORD as an environment variable
# on the machine that runs demo-service.
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Resilience4j + Feign (same values demo-service uses today)
resilience4j.circuitbreaker.instances.fileService.sliding-window-size=5
resilience4j.circuitbreaker.instances.fileService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.fileService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fileService.wait-duration-in-open-state=2s
resilience4j.retry.instances.fileService.max-attempts=2
feign.client.config.default.read-timeout=1000

# Used by the @RefreshScope demo (see config-server/README.md)
app.message=Hello from config-repo (default profile)

# "refresh" is required for POST /actuator/refresh
management.endpoints.web.exposure.include=health,refresh,circuitbreakers
